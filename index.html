<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpiderMitoBR Games</title>
<meta name="description" content="Jogos para Android feitos por SpiderMitoBR.">
<style>
  :root{--bg:#fff4f8;--ink:#3b2a3f;--muted:#6f5f74;--line:#f0dfe9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito","Segoe UI",system-ui,sans-serif}
  main{max-width:640px;margin:0 auto;padding:48px 16px}
  h1{font-size:30px;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 28px}
  .game{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
  .game svg{width:72px;height:72px;flex:none}
  .game h2{margin:0;font-size:22px}
  .game p{margin:4px 0 8px;color:var(--muted)}
  a{color:#c2386f;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>SpiderMitoBR Games</h1>
  <p class="sub">Jogos para Android.</p>
  <div class="game">
    <svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="55" rx="40" ry="35" fill="#ff9cc2" stroke="#d96b97" stroke-width="3"/><circle cx="37" cy="48" r="9" fill="#fff"/><circle cx="63" cy="48" r="9" fill="#fff"/><circle cx="38" cy="49" r="4.5" fill="#2b2233"/><circle cx="64" cy="49" r="4.5" fill="#2b2233"/><path d="M40 64 Q50 74 60 64" stroke="#2b2233" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
    <div>
      <h2>Bolota</h2>
      <p>Cuide do seu bichinho virtual, jogue minigames e descubra todas as evoluções.</p>
      <a href="bolota/privacidade.html">Política de privacidade</a>
    </div>
  </div>
</main>
</body>
</html>
